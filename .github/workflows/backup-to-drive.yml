name: Backup diario a Google Drive

on:
  schedule:
    - cron: '0 2 * * *'  # diario a las 02:00 UTC
  workflow_dispatch:      # permite trigger manual desde la pestaña Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Crear ZIP del repo
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          ZIP_NAME="sports-stats-21-${DATE}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/*"
          ls -lh "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Subir backup a Google Drive
        run: |
          rclone copy "$ZIP_NAME" "gdrive:Sports Stats 21 Backups/" --progress
          echo "Backup subido: $ZIP_NAME"
