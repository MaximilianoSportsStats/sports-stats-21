name: Backup diario a Google Drive

on:
  schedule:
    - cron: '0 2 * * *'  # diario a las 02:00 UTC
  workflow_dispatch:      # permite trigger manual desde la pestaña Actions
  push:
    branches: [main]      # backup también cada vez que se suben cambios

permissions:
  contents: write   # necesario para el commit de keepalive

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Crear ZIP del repo
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          ZIP_NAME="sports-stats-21-${DATE}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/*"
          ls -lh "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Subir backup a Google Drive
        run: |
          rclone copy "$ZIP_NAME" "gdrive:Sports Stats 21 Backups/" --progress
          echo "Backup subido: $ZIP_NAME"

      # GitHub apaga los workflows programados tras 60 días sin actividad.
      # Si el último commit tiene más de 45 días, hacemos un commit vacío
      # para mantener vivo el repo (y con eso, el backup diario).
      - name: Keepalive (evita que GitHub apague el backup)
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Días desde el último commit: $DAYS"
          if [ "$DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: mantener activo el backup diario"
            git push
          fi
